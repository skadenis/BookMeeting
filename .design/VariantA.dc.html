<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px; color: rgba(0,0,0,.88); background: #f5f5f5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #1677ff; text-decoration: none; }
    a:hover { color: #4096ff; }

    .wrap { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
    .card { background: #fff; border-radius: 8px;
      box-shadow: 0 1px 2px 0 rgba(0,0,0,.03), 0 1px 6px -1px rgba(0,0,0,.02), 0 2px 4px 0 rgba(0,0,0,.02); }

    .note {
      display: flex; align-items: center; gap: 8px; padding: 8px 14px;
      background: #e6f4ff; border: 1px solid #91caff; border-radius: 6px;
      font-size: 12px; color: #0958d9;
    }

    .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; flex-wrap: wrap; }
    .muted { color: rgba(0,0,0,.45); }
    .sep { width: 1px; height: 18px; background: #f0f0f0; }
    .select { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 11px;
      min-width: 230px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fff; }
    .nav { display: flex; }
    .navbtn { height: 32px; min-width: 32px; padding: 0 10px; border: 1px solid #d9d9d9;
      background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .navbtn:first-child { border-radius: 6px 0 0 6px; }
    .navbtn:last-child { border-radius: 0 6px 6px 0; }
    .navbtn + .navbtn { margin-left: -1px; }

    .gridcard { padding: 0; overflow: hidden; }
    .grid { display: grid; }

    .hcell { padding: 8px 10px; background: #fafafa; border-bottom: 1px solid #f0f0f0;
      border-right: 1px solid #f0f0f0; display: flex; flex-direction: column; gap: 2px; }
    .hcell-today { background: #e6f4ff; }
    .h-dow { font-size: 13px; font-weight: 600; }
    .h-date { font-size: 12px; color: rgba(0,0,0,.45); }

    .tcell { display: flex; align-items: center; justify-content: flex-end; padding: 0 10px;
      font-size: 12px; color: rgba(0,0,0,.45); border-bottom: 1px solid #f0f0f0;
      border-right: 1px solid #f0f0f0; background: #fafafa; font-variant-numeric: tabular-nums; }
    .tcell-hour { color: rgba(0,0,0,.88); font-weight: 500; }
    .tcorner { background: #fafafa; border-bottom: 1px solid #f0f0f0; border-right: 1px solid #f0f0f0; }

    .cellwrap { padding: 3px; border-bottom: 1px solid #f0f0f0; border-right: 1px solid #f0f0f0; }
    /* Кнопка сохранена как в текущем виджете, но подпись стала короче:
       время больше не дублируется в каждой из 140 кнопок */
    .slot { height: 30px; border-radius: 6px; display: flex; align-items: center;
      justify-content: center; font-size: 13px; cursor: pointer; border: 1px solid transparent; }
    .slot-free { background: #52c41a; color: #fff; }
    .slot-free:hover { background: #73d13d; }
    .slot-tight { background: #faad14; color: #fff; }
    .slot-tight:hover { background: #ffc53d; }
    .slot-full { background: #ff4d4f; color: #fff; cursor: not-allowed; opacity: .5; }
    .slot-past { background: #f5f5f5; color: rgba(0,0,0,.25); cursor: not-allowed; }
    .slot-sel { background: #1677ff; color: #fff; box-shadow: 0 0 0 2px #91caff; }
    .slot-mine { background: #faad14; color: #fff; box-shadow: 0 0 0 2px #ffe58f; }

    .closed { background: repeating-linear-gradient(135deg,#fafafa,#fafafa 6px,#f5f5f5 6px,#f5f5f5 12px);
      border-right: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: center; }
    .closed-label { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px;
      color: rgba(0,0,0,.35); white-space: nowrap; }
    .closed-head { padding: 8px 4px; background: #fafafa; border-bottom: 1px solid #f0f0f0;
      border-right: 1px solid #f0f0f0; }
    .closed-head-inner { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; color: rgba(0,0,0,.45); }
  </style>
</helmet>

<div class="wrap">
  <div class="note">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/></svg>
    <span>Вариант A — минимальное вмешательство: та же сетка и те же цветные кнопки, но время вынесено в ось слева, а нерабочие дни сжаты в полосу</span>
  </div>

  <div class="card bar">
    <span style="font-weight: 600">Лид #357127</span>
    <span class="sep"></span>
    <div class="select">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1677ff" stroke-width="2" stroke-linecap="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Минск, ул Ленина 15</span>
    </div>
    <span class="sep"></span>
    <div class="nav">
      <div class="navbtn">‹</div><div class="navbtn">Сегодня</div><div class="navbtn">›</div>
    </div>
    <span class="muted" style="font-size: 13px">31 авг — 6 сен</span>
    <span style="flex-grow: 1"></span>
    <span class="muted" style="font-size: 12px">Запись на 7 дней вперёд</span>
  </div>

  <div class="card gridcard">
    <div class="grid" style="grid-template-columns: {{gridCols}}">
      <div class="tcorner"></div>
      <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <sc-if value="{{d.open}}" hint-placeholder-val="{{true}}">
          <div class="{{d.headCls}}">
            <span class="h-dow">{{d.dow}}</span>
            <span class="h-date">{{d.date}}</span>
          </div>
        </sc-if>
        <sc-if value="{{d.closed}}" hint-placeholder-val="{{false}}">
          <div class="closed-head"><span class="closed-head-inner">{{d.dow}} {{d.date}}</span></div>
        </sc-if>
      </sc-for>

      <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
        <div class="{{row.timeCls}}">{{row.time}}</div>
        <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="7">
          <sc-if value="{{c.open}}" hint-placeholder-val="{{true}}">
            <div class="cellwrap"><div class="{{c.cls}}" onClick="{{c.pick}}">{{c.label}}</div></div>
          </sc-if>
          <sc-if value="{{c.closed}}" hint-placeholder-val="{{false}}">
            <div class="closed"><span class="closed-label">{{c.label}}</span></div>
          </sc-if>
        </sc-for>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "capacity": {"editor": "int", "default": 4, "min": 1, "max": 12},
  "$preview": {"width": 1280, "height": 640}
}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: null }; }

  renderVals() {
    const days = [
      { dow: 'Пн', date: '31 авг', open: true, today: true },
      { dow: 'Вт', date: '1 сен', open: true, today: false },
      { dow: 'Ср', date: '2 сен', open: true, today: false },
      { dow: 'Чт', date: '3 сен', open: false, today: false },
      { dow: 'Пт', date: '4 сен', open: false, today: false },
      { dow: 'Сб', date: '5 сен', open: false, today: false },
      { dow: 'Вс', date: '6 сен', open: false, today: false },
    ];
    const times = [];
    for (let m = 9 * 60; m < 13 * 60; m += 30) {
      const h = Math.floor(m / 60), mm = m % 60;
      times.push({ label: `${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`, isHour: mm === 0, min: m });
    }
    const cap = Number(this.props.capacity ?? 4);
    const freeAt = (di, min) => Math.max(0, cap - Math.floor(((di * 37 + min / 30 * 11) % 7) / 3));

    const gridCols = ['56px'].concat(days.map((d) => (d.open ? 'minmax(140px, 1fr)' : '40px'))).join(' ');

    return {
      gridCols,
      days: days.map((d) => ({
        ...d,
        closed: !d.open,
        headCls: d.today ? 'hcell hcell-today' : 'hcell',
      })),
      rows: times.map((t) => ({
        time: t.label,
        timeCls: t.isHour ? 'tcell tcell-hour' : 'tcell',
        cells: days.map((d, di) => {
          if (!d.open) return { open: false, closed: true, label: t.isHour ? 'нерабочий день' : '', cls: 'closed', pick: null };
          const key = `${di}-${t.label}`;
          const past = d.today && t.min < 10 * 60;
          const mine = di === 0 && t.label === '11:00';
          const free = freeAt(di, t.min);
          let cls = 'slot slot-free', label = `${free} свободно`;
          if (past) { cls = 'slot slot-past'; label = 'прошло'; }
          else if (mine) { cls = 'slot slot-mine'; label = 'ваша встреча'; }
          else if (free === 0) { cls = 'slot slot-full'; label = 'нет мест'; }
          else if (free === 1) { cls = 'slot slot-tight'; label = '1 место'; }
          if (this.state.picked === key && !past && !mine && free > 0) cls = 'slot slot-sel';
          return { open: true, closed: false, label, cls,
            pick: past || mine || free === 0 ? null : () => this.setState({ picked: key }) };
        }),
      })),
    };
  }
}
</script>
</body>
</html>
