name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Скрипт деплоя проверяется до подключения к серверу: сломанный
      # синтаксис не должен доезжать до прода
      - name: Check deploy script
        run: |
          bash -n scripts/deploy.sh
          if command -v shellcheck >/dev/null; then shellcheck scripts/deploy.sh; fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # script_stop: false meant the step kept going after a failed
          # command and reported a partial deploy as success
          script_stop: true
          script: |
            set -e

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              echo "DEPLOY_PATH secret is required"
              exit 1
            fi
            echo "Deploy path: $DEPLOY_PATH"

            # Everything sent through ssh-action stays ASCII on purpose: a long
            # script with non-ASCII text arrived on the server mangled and died
            # with "syntax error near unexpected token". The real deploy logic
            # lives in scripts/deploy.sh, which travels by git and is checked
            # with bash -n in CI.

            if [ -d "$DEPLOY_PATH/.git" ]; then
              echo "Updating existing checkout..."
              cd "$DEPLOY_PATH"
              git fetch origin main --depth=1
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              mkdir -p "$DEPLOY_PATH"
              git clone --depth=1 https://github.com/${{ github.repository }} "$DEPLOY_PATH"
              cd "$DEPLOY_PATH"
            fi

            echo "Now at:"
            git log --oneline -1

            test -f scripts/deploy.sh || { echo "scripts/deploy.sh is missing"; exit 1; }
            bash scripts/deploy.sh
