services:
  backend:
    build: ./backend
    container_name: bookmeeting-backend
    networks:
      - app-network
    environment:
      # Офисы работают по Минску; без этого контейнер живёт в UTC
      TZ: Europe/Minsk
      BUSINESS_TZ: Europe/Minsk
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: meetings
      DB_USERNAME: meetings
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD обязателен}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BITRIX_DEV_MODE: "false"
      BITRIX_REST_URL: ${BITRIX_REST_URL:?BITRIX_REST_URL обязателен}
      ENABLE_LEADS_SYNC: ${ENABLE_LEADS_SYNC:-true}
      ENABLE_CRON: ${ENABLE_CRON:-true}
      # Домен расходился с README и certbot (centrcred.by): перечислены оба,
      # уточните реальный и уберите лишний
      CORS_ORIGIN: ${CORS_ORIGIN:-https://book-meeting.centrcred.by,https://book-meeting.centr-cred.by}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@centrcred.by}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD обязателен}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET обязателен}
      PUBLIC_TOKEN_PAIRS: ${PUBLIC_TOKEN_PAIRS:?PUBLIC_TOKEN_PAIRS обязателен}
      CRON_TOKEN: ${CRON_TOKEN:-}
      BITRIX_ALLOWED_DOMAINS: ${BITRIX_ALLOWED_DOMAINS:-}
      LEADS_SYNC_CRON: ${LEADS_SYNC_CRON:-*/5 * * * *}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # 12 операторов офиса делят один NAT-адрес, лимит считается на IP
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-3000}
      DB_POOL_MAX: ${DB_POOL_MAX:-30}
      SLOTS_CACHE_TTL: ${SLOTS_CACHE_TTL:-10}
    ports:
      - "4400:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_PUBLIC_APP_ID: ${VITE_PUBLIC_APP_ID:-}
        VITE_PUBLIC_APP_TOKEN: ${VITE_PUBLIC_APP_TOKEN:-}
    container_name: bookmeeting-frontend
    networks:
      - app-network
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: bookmeeting-postgres
    networks:
      - app-network
    environment:
      POSTGRES_DB: meetings
      POSTGRES_USER: meetings
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD обязателен}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetings -d meetings"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    container_name: bookmeeting-redis
    networks:
      - app-network
    volumes:
      - redis_data:/data
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

